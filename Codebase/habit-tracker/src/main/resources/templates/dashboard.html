<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styleDashboard.css}">
  <script th:src="@{/js/dashboard.js}" defer></script>
</head>
<body class="dashboard-page">
  <header class="dashboard-header">
    <span class="dashboard-brand-heart" aria-hidden="true">&hearts;</span>
    <span>Habit Tracker</span>
    <nav class="dashboard-nav" aria-label="Main navigation">
      <a class="active" aria-current="page" th:href="@{/dashboard}">Dashboard</a>
      <a th:href="@{/calendar}">Calendar</a>
      <a th:href="@{/statistics}">Statistics</a>
      <a th:href="@{/profile}">Profile</a>
      <form method="post" th:action="@{/logout}" class="dashboard-logout">
        <button type="submit">Log Out</button>
      </form>
    </nav>
    <span class="dashboard-user-icon" aria-hidden="true"></span>
  </header>

  <h6>Welcome, <span th:text="${username}">user</span>!</h6>

  <main>
    <div class="layout">

      <section class="habits-col" aria-label="Your habits">
        <div id="list"></div>
      </section>

      <form id="habit-form" novalidate>
        <div>
          <label class="t" for="name">Habit name</label>
          <input type="text" id="name" maxlength="60" placeholder="Read 10 pages" autocomplete="off">
        </div>

        <div class="row">
          <div><label class="t" for="start">Start date</label><input type="date" id="start"></div>
          <div><label class="t" for="end">End date</label><input type="date" id="end"></div>
        </div>

        <div>
          <label class="t" for="duration">Duration</label>
          <select id="duration">
            <option value="15 min">15 minutes</option>
            <option value="30 min" selected>30 minutes</option>
            <option value="45 min">45 minutes</option>
            <option value="1 hr">1 hour</option>
            <option value="2 hr">2 hours</option>
          </select>
        </div>

        <fieldset>
          <legend>Time of day</legend>
          <div class="chips" id="times"></div>
        </fieldset>

        <p class="error" id="error" role="alert"></p>

        <div class="btns">
          <button type="submit" class="create" id="submit-btn">Create habit</button>
          <button type="button" class="cancel" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>

    </div>
  </main>
  <footer class="dashboard-footer">
    <span class="dashboard-footer-heart" aria-hidden="true">&hearts;</span>
    <span>Habit Tracker</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
