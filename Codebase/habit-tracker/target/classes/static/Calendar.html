<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | Habit Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/styleCalendar.css">
</head>
<body class="calendar-page">
    <header class="logout-header profile-header calendar-header">
        <span class="logout-heart" aria-hidden="true">&hearts;</span>
        <span>Habit Tracker</span>
        <nav class="profile-nav" aria-label="Main navigation">
            <a href="/dashboard">Dashboard</a>
            <a href="/calendar" aria-current="page">Calendar</a>
            <a href="/statistics">Statistics</a>
            <a href="/profile">Profile</a>
        </nav>
        <span class="profile-user-icon" aria-hidden="true"></span>
    </header>

    <main class="calendar-content">
        <section class="calendar-card" aria-label="Calendar">
            <div class="calendar-month-bar">
                <button class="calendar-month-button" id="previous-month" type="button" aria-label="Previous month">&lsaquo;</button>
                <h1 id="calendar-month" aria-live="polite">Loading calendar...</h1>
                <button class="calendar-month-button" id="next-month" type="button" aria-label="Next month">&rsaquo;</button>
            </div>
            <table class="calendar-grid" aria-label="Days in the selected month">
                <thead>
                    <tr>
                        <th scope="col">Sun</th>
                        <th scope="col">Mon</th>
                        <th scope="col">Tue</th>
                        <th scope="col">Wed</th>
                        <th scope="col">Thu</th>
                        <th scope="col">Fri</th>
                        <th scope="col">Sat</th>
                    </tr>
                </thead>
                <tbody id="calendar-days"></tbody>
            </table>
            <p class="calendar-legend"><span aria-hidden="true">&bull;</span> Task due</p>
            <p class="calendar-error" id="calendar-error" role="alert" hidden></p>
        </section>

        <section class="day-history" aria-labelledby="day-history-title">
            <h2 id="day-history-title">Day History <span id="selected-date"></span></h2>
            <div class="history-card">
                <div class="history-status" role="group" aria-label="Day status">
                    <button class="status-button is-active" data-status="completed" type="button" aria-pressed="true">Completed</button>
                    <button class="status-button" data-status="not-completed" type="button" aria-pressed="false">Not Completed</button>
                    <button class="status-button" data-status="final-day" type="button" aria-pressed="false">Final Day</button>
                </div>
                <form class="task-entry" id="task-form">
                    <label class="visually-hidden" for="task-name">New task</label>
                    <input id="task-name" name="taskName" type="text" maxlength="100" placeholder="Add a task" required>
                    <button type="submit">Add</button>
                </form>
                <p class="day-error" id="task-error" role="alert" hidden></p>
                <div id="day-tasks" aria-live="polite"></div>
            </div>
        </section>

        <section class="calendar-notes" aria-labelledby="calendar-notes-title">
            <h2 id="calendar-notes-title">Notes</h2>
            <textarea id="calendar-note" aria-label="Notes for the selected day"></textarea>
            <button class="save-note-button" id="save-note" type="button">Save Notes</button>
            <p class="day-error" id="note-error" role="alert" hidden></p>
        </section>
    </main>

    <footer class="logout-footer calendar-footer">
        <span class="logout-heart" aria-hidden="true">&hearts;</span>
        <span>Habit Tracker</span>
    </footer>

    <script>
        const monthTitle = document.getElementById("calendar-month");
        const calendarDays = document.getElementById("calendar-days");
        const selectedDateLabel = document.getElementById("selected-date");
        const calendarError = document.getElementById("calendar-error");
        const dayTasks = document.getElementById("day-tasks");
        const taskError = document.getElementById("task-error");
        const noteError = document.getElementById("note-error");
        const noteInput = document.getElementById("calendar-note");
        let displayedMonth;
        let selectedDay;
        let today;
        let activeStatus = "completed";

        function setActiveStatus(status) {
            activeStatus = status;
            document.querySelectorAll(".status-button").forEach((button) => {
                const isActive = button.dataset.status === status;
                button.classList.toggle("is-active", isActive);
                button.setAttribute("aria-pressed", String(isActive));
            });
        }

        function selectedDateIso() {
            const month = String(displayedMonth.month).padStart(2, "0");
            const day = String(selectedDay).padStart(2, "0");
            return `${displayedMonth.year}-${month}-${day}`;
        }

        function updateSelectedDay() {
            const date = new Date(displayedMonth.year, displayedMonth.month - 1, selectedDay);
            selectedDateLabel.textContent = `(${date.toLocaleDateString(undefined, {
                month: "short",
                day: "numeric",
                year: "numeric"
            })})`;
            calendarDays.querySelectorAll(".calendar-day").forEach((button) => {
                const isSelected = Number(button.dataset.day) === selectedDay;
                button.classList.toggle("is-selected", isSelected);
                button.setAttribute("aria-pressed", String(isSelected));
            });
            loadDay();
        }

        function renderTasks(tasks) {
            dayTasks.replaceChildren();
            const visibleTasks = tasks.filter((task) => {
                if (task.completed) return activeStatus === "completed";
                if (task.finalDay) return activeStatus === "final-day";
                return activeStatus === "not-completed";
            });
            const sections = [
                ["all day", "All Day"],
                ["morning", "Morning"],
                ["evening", "Evening"]
            ];
            sections.forEach(([timeOfDay, heading]) => {
                const groupedTasks = visibleTasks.filter(
                    (task) => (task.timeOfDay || "all day").toLowerCase() === timeOfDay
                );
                if (groupedTasks.length === 0) return;
                const title = document.createElement("h3");
                title.textContent = heading;
                dayTasks.append(title);
                groupedTasks.forEach((task) => {
                    const button = document.createElement("button");
                    button.className = `habit-row${task.completed ? " is-complete" : ""}`;
                    button.type = "button";
                    button.setAttribute("aria-pressed", String(task.completed));
                    const label = document.createElement("span");
                    label.textContent = `${task.taskName} | ${task.goal} ${task.unit}`;
                    const check = document.createElement("span");
                    check.className = "habit-check";
                    check.setAttribute("aria-hidden", "true");
                    button.append(label, check);
                    button.addEventListener("click", async () => {
                        taskError.hidden = true;
                        try {
                            const response = await fetch(
                                `/api/calendar/tasks/${task.taskId}/completion?date=${encodeURIComponent(selectedDateIso())}`,
                                {
                                    method: "PUT",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ completed: !task.completed })
                                }
                            );
                            if (!response.ok) throw new Error(`Could not update task (${response.status}).`);
                            setActiveStatus(
                                !task.completed ? "completed" : task.finalDay ? "final-day" : "not-completed"
                            );
                            await loadDay();
                        } catch (error) {
                            taskError.textContent = error.message;
                            taskError.hidden = false;
                        }
                    });
                    dayTasks.append(button);
                });
            });
            if (visibleTasks.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.className = "empty-day";
                emptyMessage.textContent = "No tasks in this tab for the selected day.";
                dayTasks.append(emptyMessage);
            }
        }

        async function loadDay() {
            taskError.hidden = true;
            noteError.hidden = true;
            try {
                const response = await fetch(`/api/calendar/day?date=${encodeURIComponent(selectedDateIso())}`);
                if (!response.ok) throw new Error(`Could not load this day (${response.status}).`);
                const data = await response.json();
                renderTasks(data.tasks);
                noteInput.value = data.note;
            } catch (error) {
                dayTasks.replaceChildren();
                taskError.textContent = error.message;
                taskError.hidden = false;
            }
        }

        async function renderMonth(year, month) {
            calendarError.hidden = true;
            monthTitle.textContent = "Loading calendar...";
            try {
                const query = year === undefined
                    ? ""
                    : `?year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`;
                const response = await fetch(`/api/calendar/month${query}`);
                if (!response.ok) {
                    throw new Error(`Calendar request failed (${response.status}).`);
                }

                const data = await response.json();
                displayedMonth = { year: data.year, month: data.month };
                today = data.today;
                const dueDays = new Set(data.dueDays);
                monthTitle.textContent = `${data.monthName}, ${data.year}`;

                const previousMonth = displayedMonth.month === 1
                    ? { year: displayedMonth.year - 1, month: 12 }
                    : { year: displayedMonth.year, month: displayedMonth.month - 1 };
                const nextMonth = displayedMonth.month === 12
                    ? { year: displayedMonth.year + 1, month: 1 }
                    : { year: displayedMonth.year, month: displayedMonth.month + 1 };
                document.getElementById("previous-month").onclick =
                    () => renderMonth(previousMonth.year, previousMonth.month);
                document.getElementById("next-month").onclick =
                    () => renderMonth(nextMonth.year, nextMonth.month);

                const firstDayOffset = data.firstDayOffset;
                const weekCount = 6;
                calendarDays.replaceChildren();
                for (let week = 0; week < weekCount; week += 1) {
                    const row = document.createElement("tr");
                    for (let weekday = 0; weekday < 7; weekday += 1) {
                        const cell = document.createElement("td");
                        const dayNumber = week * 7 + weekday - firstDayOffset + 1;
                        if (dayNumber >= 1 && dayNumber <= data.daysInMonth) {
                            const button = document.createElement("button");
                            button.className = "calendar-day";
                            button.type = "button";
                            button.dataset.day = String(dayNumber);
                            button.textContent = String(dayNumber);
                            button.setAttribute("aria-label", new Date(
                                displayedMonth.year,
                                displayedMonth.month - 1,
                                dayNumber
                            ).toLocaleDateString(undefined, {
                                weekday: "long",
                                month: "long",
                                day: "numeric",
                                year: "numeric"
                            }));
                            if (dueDays.has(dayNumber)) {
                                button.classList.add("has-due-task");
                                button.setAttribute(
                                    "aria-label",
                                    `${button.getAttribute("aria-label")}, task due`
                                );
                            }
                            if (today.year === displayedMonth.year
                                && today.month === displayedMonth.month
                                && today.day === dayNumber) {
                                button.classList.add("is-today");
                                button.setAttribute("aria-current", "date");
                            }
                            button.addEventListener("click", () => {
                                selectedDay = dayNumber;
                                updateSelectedDay();
                            });
                            cell.append(button);
                        }
                        row.append(cell);
                    }
                    calendarDays.append(row);
                }
                selectedDay = today.year === displayedMonth.year && today.month === displayedMonth.month
                    ? today.day
                    : 1;
                updateSelectedDay();
            } catch (error) {
                monthTitle.textContent = "Calendar unavailable";
                calendarError.textContent = error.message;
                calendarError.hidden = false;
            }
        }

        document.querySelectorAll(".status-button").forEach((button) => {
            button.addEventListener("click", () => {
                setActiveStatus(button.dataset.status);
                loadDay();
            });
        });

        document.getElementById("task-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            taskError.hidden = true;
            const taskName = document.getElementById("task-name");
            try {
                const response = await fetch("/api/calendar/tasks", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ taskName: taskName.value, date: selectedDateIso() })
                });
                if (!response.ok) throw new Error(`Could not add task (${response.status}).`);
                taskName.value = "";
                setActiveStatus("final-day");
                await loadDay();
            } catch (error) {
                taskError.textContent = error.message;
                taskError.hidden = false;
            }
        });

        document.getElementById("save-note").addEventListener("click", async () => {
            noteError.hidden = true;
            try {
                const response = await fetch("/api/calendar/notes", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ date: selectedDateIso(), text: noteInput.value })
                });
                if (!response.ok) throw new Error(`Could not save notes (${response.status}).`);
            } catch (error) {
                noteError.textContent = error.message;
                noteError.hidden = false;
            }
        });

        renderMonth();
    </script>
</body>
</html>
