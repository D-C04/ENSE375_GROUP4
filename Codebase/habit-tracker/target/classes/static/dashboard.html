<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/6.0.0-alpha.1/js/bootstrap.min.js" rel="stylesheet">
  <script src="dashboard.js" defer></script>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>


<h2> Habit Tracker </h2>
<ul class="nav justify-content-center">
  <li class="nav-item">
    <a class="nav-link active" aria-current="page" href="dashboard.html">Dashboard</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="Calendar.html">Calendar</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="Statistics.html">Statistics</a>
  </li>
  <li class="nav-item">
    <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
  </li>
</ul>

<main>
    <div class="layout">
  <section class="habits-col" aria-label="Your habits">
    <div id="list"></div>
  </section>

  <form id="habit-form" novalidate>
  <form id="habit-form" novalidate>
    <div>
      <label class="t" for="name">Habit name</label>
      <input type="text" id="name" maxlength="60" placeholder="Read 10 pages" autocomplete="off">
    </div>

    <div class="row">
      <div><label class="t" for="start">Start date</label><input type="date" id="start"></div>
      <div><label class="t" for="end">End date</label><input type="date" id="end"></div>
    </div>

    <div>
      <label class="t" for="duration">Duration</label>
      <select id="duration">
        <option value="15 min">15 minutes</option>
        <option value="30 min" selected>30 minutes</option>
        <option value="45 min">45 minutes</option>
        <option value="1 hr">1 hour</option>
        <option value="2 hr">2 hours</option>
      </select>
    </div>

    <fieldset>
      <legend>Time of day</legend>
      <div class="chips" id="times"></div>
    </fieldset>
<!-- 
    <fieldset>
      <legend>Icon</legend>
      <div class="chips icons" id="icons"></div>
    </fieldset> -->
      <p class="error" id="error" role="alert"></p>

   <div class="btns">
     <button type="submit" class="create" id="submit-btn">Create habit</button>
     <button type="button" class="cancel" id="cancel-btn" hidden>Cancel</button>
   </div>
 </form>

 
  <div id="list"></div>
</main>











<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
