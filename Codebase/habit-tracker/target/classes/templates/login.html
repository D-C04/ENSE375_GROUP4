<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <h3>Start Tracking Habits!</h3>

  <form method="post" th:action="@{/login}">
    <div class="input-container">
      <h4>Login!</h4>
      <p>Don't have an account? <a th:href="@{/signup}">Create One!</a></p>

      <p class="msg-error" th:if="${param.error}">Invalid username or password.</p>
      <p class="msg-ok" th:if="${param.registered}">Account created! Please log in.</p>
      <p class="msg-ok" th:if="${param.logout}">You have been logged out.</p>

      <div class="mb-3 row">
        <label for="username" class="form-label-user">Username*</label>
        <div class="col-sm-10">
          <input type="text" class="form-control-user" id="username" name="username"
                 autocomplete="username" required>
        </div>
      </div>

      <div class="mb-3 row">
        <label for="inputPassword" class="form-label-pass">Password*</label>
        <div class="col-sm-10">
          <input type="password" class="form-control-pass" id="inputPassword" name="password"
                 autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="button1">Log In!</button>
    </div>
  </form>

</body>
</html>
